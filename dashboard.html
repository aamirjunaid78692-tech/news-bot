<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News-Bot — Command Center</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; background:#f5f6f8; color:#1c2230;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:1040px; margin:0 auto; padding:24px 20px 60px; }
  h1 { font-size:22px; margin:0; }
  .sub { color:#6b7280; font-size:12.5px; margin:2px 0 20px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#16a34a; margin-right:5px;
         animation:pulse 1.6s infinite; } @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  h2 { font-size:14px; margin:24px 0 10px; color:#374151; }
  .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .card { background:#fff; border:1px solid #e6e8ec; border-radius:12px; padding:14px 16px; }
  .card .label { font-size:11px; color:#6b7280; text-transform:uppercase; letter-spacing:.04em; }
  .card .value { font-size:23px; font-weight:700; margin-top:5px; }
  .card .hint { font-size:11px; color:#9aa1ac; margin-top:3px; }
  .pos{color:#128a3e}.neg{color:#c0392b}.muted{color:#6b7280}
  .panel { background:#fff; border:1px solid #e6e8ec; border-radius:12px; padding:16px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #eef0f3;white-space:nowrap}
  th{color:#6b7280;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
  td.num,th.num{text-align:right}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600}
  .buy{background:#e7f5ec;color:#128a3e}.sell{background:#fdecea;color:#c0392b}
  .tier3{background:#eef2ff;color:#4338ca}.tier2{background:#f0f7ff;color:#1d4ed8}
  .empty{text-align:center;color:#6b7280;padding:34px 0}
  .foot{color:#9aa1ac;font-size:11.5px;margin-top:22px;text-align:center}
  .reload{float:right;font-size:12px;color:#2563eb;cursor:pointer;text-decoration:none}
  canvas{max-height:240px}
  .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f1f3f5;font-size:13px}
  .kv:last-child{border-bottom:0}.kv .k{color:#6b7280}.kv .v{font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <a class="reload" onclick="load()">&#x21bb; Refresh</a>
  <h1>News-Bot — Command Center</h1>
  <div class="sub"><span class="dot"></span>GLD news-breakout strategy · Alpaca paper · auto-refreshes every 30s from <code>trades.csv</code></div>

  <div class="cards" id="cards"></div>

  <h2>Equity curve (starting $100,000 + realized P&amp;L)</h2>
  <div class="panel"><canvas id="equity"></canvas></div>

  <div class="grid2">
    <div>
      <h2>Risk management</h2>
      <div class="panel" id="risk"></div>
    </div>
    <div>
      <h2>Targeting &amp; reward tiers</h2>
      <div class="panel"><table id="targets"></table></div>
    </div>
  </div>

  <h2>Profit / loss by event</h2>
  <div class="panel"><canvas id="byEvent"></canvas></div>

  <h2>Per-event performance</h2>
  <div class="panel" id="eventTable"></div>

  <h2>All trades</h2>
  <div class="panel" id="tradeTable"></div>

  <div class="foot" id="foot"></div>
</div>

<script>
// ---- Strategy config (mirrors config.py; update here if you change the bot) ----
const CFG = {
  symbol: "GLD",
  sizingMode: "risk-based",
  riskPerTrade: 1000,     // $ lost if stopped out
  stopPct: 0.5,           // %
  breakoutTrigger: 0.3,   // %
  holdMinutes: 30,
  startEquity: 100000,
  tiers: [
    { ev:"FOMC (rate decision)", rr:"3:1", tp:1.5, sl:0.5, when:"2:00 PM ET" },
    { ev:"CPI (inflation)",      rr:"3:1", tp:1.5, sl:0.5, when:"8:30 AM ET" },
    { ev:"Non-Farm Payrolls",    rr:"3:1", tp:1.5, sl:0.5, when:"8:30 AM ET" },
    { ev:"ISM PMI",              rr:"2:1", tp:1.0, sl:0.5, when:"10:00 AM ET" },
    { ev:"Unemployment Claims",  rr:"2:1", tp:1.0, sl:0.5, when:"8:30 AM ET" },
  ]
};

let eqChart, evChart;
const $ = id => document.getElementById(id);
const money = n => (n>=0?"+$":"-$") + Math.abs(n).toFixed(2);
const money0 = n => "$" + Math.round(n).toLocaleString();
const cls = n => n>0?"pos":(n<0?"neg":"muted");

function parseCSV(text){
  const lines = text.trim().split(/\r?\n/).filter(l=>l.length);
  if (lines.length<2) return [];
  const head = lines[0].split(",");
  return lines.slice(1).map(line=>{
    const p=line.split(","), r={};
    head.forEach((h,i)=>r[h]=p[i]);
    r.pnl_usd=parseFloat(r.pnl_usd); r.pnl_pct=parseFloat(r.pnl_pct); r.qty=parseInt(r.qty);
    return r;
  });
}

function renderStatic(){
  // Risk management panel (from CFG, always shown)
  $("risk").innerHTML = [
    ["Sizing mode", CFG.sizingMode],
    ["Risk per trade", "$"+CFG.riskPerTrade.toLocaleString()+" (≈$200k position at "+CFG.stopPct+"% stop)"],
    ["Stop-loss", CFG.stopPct+"%"],
    ["Breakout trigger", "±"+CFG.breakoutTrigger+"%"],
    ["Time exit / hold", CFG.holdMinutes+" min"],
    ["Instrument", CFG.symbol+" (gold ETF, ≈10% of spot gold)"],
  ].map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("");

  $("targets").innerHTML = `<thead><tr><th>Event</th><th>Time</th><th class="num">RR</th><th class="num">TP / SL</th></tr></thead><tbody>`+
    CFG.tiers.map(t=>`<tr><td>${t.ev}</td><td class="muted">${t.when}</td>
      <td class="num"><span class="pill ${t.rr==='3:1'?'tier3':'tier2'}">${t.rr}</span></td>
      <td class="num">+${t.tp}% / -${t.sl}%</td></tr>`).join("")+`</tbody>`;
}

function render(rows){
  renderStatic();
  if(!rows.length){
    $("cards").innerHTML = [
      ["Account (est.)", money0(CFG.startEquity), ""],
      ["Total P&L","$0.00",""],["Win rate","—",""],["Trades","0",""]
    ].map(([l,v,c])=>`<div class="card"><div class="label">${l}</div><div class="value ${c}">${v}</div></div>`).join("");
    $("eventTable").innerHTML='<div class="empty">No trades logged yet. Fills in automatically after the bot’s first trade.</div>';
    $("tradeTable").innerHTML=''; if(eqChart)eqChart.destroy(); if(evChart)evChart.destroy();
    $("foot").textContent="Waiting for the first trade… · config panels above show the live strategy settings.";
    return;
  }
  const n=rows.length;
  const wins=rows.filter(r=>r.pnl_usd>0).length;
  const total=rows.reduce((s,r)=>s+r.pnl_usd,0);
  const grossWin=rows.filter(r=>r.pnl_usd>0).reduce((s,r)=>s+r.pnl_usd,0);
  const grossLoss=rows.filter(r=>r.pnl_usd<0).reduce((s,r)=>s+r.pnl_usd,0);
  const avg=total/n;
  const largestWin=Math.max(0,...rows.map(r=>r.pnl_usd));
  const largestLoss=Math.min(0,...rows.map(r=>r.pnl_usd));
  const pf = grossLoss!==0 ? (grossWin/Math.abs(grossLoss)) : (grossWin>0?Infinity:0);

  // equity curve + max drawdown
  let eq=CFG.startEquity, peak=eq, maxDD=0; const curve=[eq];
  rows.forEach(r=>{ eq+=r.pnl_usd; curve.push(eq); peak=Math.max(peak,eq); maxDD=Math.max(maxDD,peak-eq); });

  // current streak
  let streak=0, sign=null;
  for(let i=rows.length-1;i>=0;i--){ const s=Math.sign(rows[i].pnl_usd); if(sign===null)sign=s; if(s===sign&&s!==0)streak++; else break; }
  const streakTxt = sign>0?streak+"W":(sign<0?streak+"L":"—");

  $("cards").innerHTML = [
    ["Account (est.)", money0(CFG.startEquity+total), cls(total), "start $100k + P&L"],
    ["Total P&L", money(total), cls(total), `${n} trade${n>1?"s":""}`],
    ["Win rate", (wins/n*100).toFixed(0)+"%", "", `${wins}W / ${n-wins}L`],
    ["Expectancy / trade", money(avg), cls(avg), "avg per trade"],
  ].map(([l,v,c,h])=>`<div class="card"><div class="label">${l}</div><div class="value ${c}">${v}</div><div class="hint">${h||""}</div></div>`).join("");

  // append extra risk stats into the risk panel
  $("risk").innerHTML += [
    ["Max drawdown", money0(-maxDD)],
    ["Largest win", money(largestWin)],
    ["Largest loss", money(largestLoss)],
    ["Profit factor", pf===Infinity?"∞":pf.toFixed(2)],
    ["Current streak", streakTxt],
  ].map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("");

  // per-event
  const g={}; rows.forEach(r=>{(g[r.event||"?"]=g[r.event||"?"]||[]).push(r);});
  const ev=Object.entries(g).map(([e,rs])=>{const t=rs.reduce((s,r)=>s+r.pnl_usd,0),w=rs.filter(r=>r.pnl_usd>0).length;return{e,c:rs.length,wr:w/rs.length*100,t};}).sort((a,b)=>b.t-a.t);
  $("eventTable").innerHTML=`<table><thead><tr><th>Event</th><th class="num">Trades</th><th class="num">Win rate</th><th class="num">Total P&L</th></tr></thead><tbody>`+
    ev.map(e=>`<tr><td>${e.e}</td><td class="num">${e.c}</td><td class="num">${e.wr.toFixed(0)}%</td><td class="num ${cls(e.t)}">${money(e.t)}</td></tr>`).join("")+`</tbody></table>`;

  $("tradeTable").innerHTML=`<table><thead><tr><th>Time</th><th>Event</th><th>Side</th><th class="num">Qty</th><th class="num">Entry</th><th class="num">Exit</th><th class="num">P&L</th><th>Exit</th></tr></thead><tbody>`+
    rows.slice().reverse().map(r=>`<tr><td>${r.time}</td><td>${r.event}</td>
      <td><span class="pill ${r.side}">${(r.side||"").toUpperCase()}</span></td>
      <td class="num">${r.qty}</td><td class="num">${r.entry}</td><td class="num">${r.exit}</td>
      <td class="num ${cls(r.pnl_usd)}">${money(r.pnl_usd)}</td><td class="muted">${r.exit_reason||""}</td></tr>`).join("")+`</tbody></table>`;

  if(eqChart)eqChart.destroy();
  eqChart=new Chart($("equity"),{type:"line",
    data:{labels:curve.map((_,i)=>i),datasets:[{data:curve,borderColor:"#2563eb",backgroundColor:"rgba(37,99,235,.08)",fill:true,tension:.25,pointRadius:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>"$"+Math.round(v).toLocaleString()}},x:{ticks:{callback:v=>v===0?"start":"#"+v}}}}});

  if(evChart)evChart.destroy();
  evChart=new Chart($("byEvent"),{type:"bar",
    data:{labels:ev.map(e=>e.e),datasets:[{data:ev.map(e=>e.t),backgroundColor:ev.map(e=>e.t>=0?"#128a3e":"#c0392b")}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>"$"+v}}}}});

  $("foot").textContent=`Gross wins ${money(grossWin)} · gross losses ${money(grossLoss)} · updated ${new Date().toLocaleString()}. Live account balance is on your Alpaca dashboard; this view is the strategy’s realized P&L.`;
}

async function load(){
  try{ const res=await fetch("trades.csv?t="+Date.now()); if(!res.ok){render([]);return;} render(parseCSV(await res.text())); }
  catch(e){ render([]); }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
